<!DOCTYPE html>
<meta charset="utf-8">
<title>RULESET — test harness</title>
<style>
  body { font: 13px/1.6 ui-monospace, monospace; margin: 0; padding: 12px; }
  iframe { width: 1200px; height: 780px; border: 1px solid #ccc; }
  #out { white-space: pre; }
  .ok { color: #0a7; } .bad { color: #c33; font-weight: 700; }
</style>
<div id="out">running…</div>
<iframe id="f" src="about:blank"></iframe>
<script>
const out = document.getElementById('out');
const f = document.getElementById('f');
const lines = [];
let fails = 0;
function log(ok, msg) {
  if (!ok) fails++;
  lines.push((ok ? '  ok  ' : ' FAIL ') + msg);
  out.innerHTML = lines.map(l => '<span class="' + (l[1] === 'o' ? 'ok' : 'bad') + '">' + l + '</span>').join('\n');
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* Headless Chrome composites almost no frames, so native rAF stalls after
   load. Back it with setTimeout (which virtual time fast-forwards) and
   restart the engine loop on top of it. Test-harness only. */
function pumpFrames(w) {
  w.cancelAnimationFrame(w.RULESET.rafId);
  w.requestAnimationFrame = cb => w.setTimeout(() => cb(w.performance.now()), 16);
  w.RULESET.lastT = 0;
  w.RULESET.loop();
  w.RULESET.load(w.RULESET.index);   // rebuild under the pumped clock
}

function loadLevel(n) {
  return new Promise(res => {
    f.onload = () => setTimeout(() => {
      const w = f.contentWindow;
      pumpFrames(w);
      setTimeout(() => res(w), 80);
    }, 60);
    f.src = 'index.html?level=' + n + '&t=' + Math.random();
  });
}

function hookSolve(w) {
  const box = { solved: false };
  w.RULESET.solve = () => { box.solved = true; };   // suppress auto-advance
  return box;
}

const mid = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };

function pev(w, type, el, x, y) {
  el.dispatchEvent(new w.PointerEvent(type, {
    clientX: x, clientY: y, pointerId: 1, isPrimary: true, pointerType: 'mouse',
    button: type === 'pointerup' ? 0 : 0, buttons: type === 'pointerup' ? 0 : 1,
    bubbles: true, cancelable: true, composed: true
  }));
}

async function dragTo(w, el, to, steps) {
  steps = steps || 6;
  const from = mid(el);
  pev(w, 'pointerdown', el, from.x, from.y);
  await wait(16);
  const a = mid(el);            // element may have been reparented on grab
  for (let i = 1; i <= steps; i++) {
    pev(w, 'pointermove', el, from.x + (to.x - a.x) * i / steps, from.y + (to.y - a.y) * i / steps);
    await wait(16);
  }
  pev(w, 'pointerup', el, to.x, to.y);
  await wait(40);
}

function click(w, el) { el.dispatchEvent(new w.MouseEvent('click', { bubbles: true })); }

window.addEventListener('unhandledrejection', e => {
  lines.push(' FAIL harness rejection: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
  out.textContent = lines.join('\n');
});

(async function run() {
 try {
  /* ---------------------------------------------------- 01 word → dot -- */
  {
    const w = await loadLevel(1);
    w.localStorage.clear();
    const box = hookSolve(w);
    const d = w.document;
    const dot = d.querySelector('.dot');
    const end = [...d.querySelectorAll('.w')].find(s => s.dataset.word === 'end');
    log(!!dot && !!end, 'L1 has a dot and a free "end" word');
    log(end.classList.contains('is-free'), 'L1 "end" carries the draggable affordance');

    /* A lifted word must not jump. The instruction is centred, so inserting
       the gap placeholder re-centres the line and slides the word sideways by
       half its own width — measuring after that hands the drag a position the
       placeholder invented, and the word rides the pointer permanently offset. */
    {
      const was = mid(end);
      const type = p => w.getComputedStyle(end).getPropertyValue(p);
      const wasType = [type('font-size'), type('font-weight'), type('letter-spacing')];
      pev(w, 'pointerdown', end, was.x, was.y);
      await wait(40);
      const now = mid(end);
      log(Math.abs(now.x - was.x) < 2 && Math.abs(now.y - was.y) < 2,
          'L1 picking a word up does not move it (drift ' +
          Math.round(now.x - was.x) + ',' + Math.round(now.y - was.y) + 'px)');

      /* A word lifted into .loose no longer inherits from .instruction. Without
         carrying its type across, the glyphs collapse to body size inside the
         box detach() pinned — the word visibly shrinks away from the pointer. */
      const nowType = [type('font-size'), type('font-weight'), type('letter-spacing')];
      log(nowType.join('/') === wasType.join('/'),
          'L1 a lifted word keeps the sentence type (' + wasType.join('/') +
          ' → ' + nowType.join('/') + ')');
      log(parseFloat(nowType[0]) > 20,
          'and that type is the instruction scale, not body text (' + nowType[0] + ')');
      pev(w, 'pointermove', end, was.x + 120, was.y + 60);
      await wait(30);
      const held = mid(end);
      log(Math.abs(held.x - (was.x + 120)) < 3 && Math.abs(held.y - (was.y + 60)) < 3,
          'and it stays under the pointer while dragged');
      pev(w, 'pointerup', end, was.x + 120, was.y + 60);
      await wait(40);
    }

    const before = mid(d.querySelector('.door'));
    await dragTo(w, dot, { x: before.x - 40, y: before.y });
    await wait(300);
    const after = mid(d.querySelector('.door'));
    log(Math.hypot(after.x - before.x, after.y - before.y) > 20, 'L1 door flees the dot');
    log(!box.solved, 'L1 not solved by chasing the door');

    await dragTo(w, end, mid(dot));
    await wait(60);
    log(box.solved, 'L1 solves when "end" is dragged to the dot');
    log(d.querySelector('.loose').contains(end), 'L1 lifted word moved into the free layer');
    log(!!d.querySelector('.instruction .ph'), 'L1 sentence left a collapsing placeholder');
  }

  /* ------------------------------------------------------- 02 resize -- */
  {
    const w = await loadLevel(2);
    const box = hookSolve(w);
    const d = w.document;
    const five = [...d.querySelectorAll('.num')].find(n => n.textContent.trim()[0] === '5');
    const ten = [...d.querySelectorAll('.num')].find(n => n.textContent.trim().indexOf('10') === 0);
    const handle = five.querySelector('.rs-handle');
    log(!!handle, 'L2 the 5 has a resize handle');
    log(!box.solved, 'L2 not solved at rest');
    const h = mid(handle);
    await dragTo(w, handle, { x: h.x + 320, y: h.y + 320 }, 10);
    await wait(60);
    const a = five.getBoundingClientRect(), b = ten.getBoundingClientRect();
    log(a.width > b.width && a.height > b.height, 'L2 the 5 became physically larger (' +
      Math.round(a.width) + '×' + Math.round(a.height) + ' vs ' + Math.round(b.width) + '×' + Math.round(b.height) + ')');
    log(box.solved, 'L2 solves on size comparison');
  }

  /* ------------------------------------------- 03 remove "red" route -- */
  {
    const w = await loadLevel(3);
    const box = hookSolve(w);
    const d = w.document;
    const btn = [...d.querySelectorAll('.gbtn')].find(b => b.textContent === 'CONTINUE');
    log(btn.classList.contains('is-red'), 'L3 the button starts red');
    click(w, btn);
    await wait(40);
    log(!box.solved, 'L3 pressing a red button is refused');

    /* The tray belongs to the puzzle, not to the window. Pinned to the board's
       floor it stranded itself below the centred stage with a dead gap; it now
       hangs off the sentence row, so it stays put however tall the viewport is. */
    {
      const vr = d.querySelector('#void').getBoundingClientRect();
      const rr = d.querySelector('.underline-row').getBoundingClientRect();
      const br = d.querySelector('.board').getBoundingClientRect();
      const gap = vr.top - rr.bottom;
      log(gap > 0 && gap < 48, 'L3 the discard tray sits just under the sentence row (' +
          Math.round(gap) + 'px)');
      log(d.querySelector('#void').offsetParent === d.querySelector('.underline-row'),
          'and is measured from that row, not from the floor of the board');
      log(Math.abs((vr.left + vr.right) / 2 - (br.left + br.right) / 2) < 2,
          'and stays centred on the board');
    }

    /* A discardable word dropped back on the sentence must let go of the type
       detach() pinned to it, or it freezes at the size it was lifted at. */
    {
      const rw = [...d.querySelectorAll('.w')].find(s => s.dataset.word === 'red');
      const at = mid(rw);
      pev(w, 'pointerdown', rw, at.x, at.y);
      await wait(40);
      log(!!rw.style.fontSize, 'L3 a lifted word carries its type inline');
      pev(w, 'pointermove', rw, at.x + 6, at.y + 2);
      await wait(30);
      pev(w, 'pointerup', rw, at.x + 6, at.y + 2);
      await wait(60);
      log(!rw.style.fontSize && !rw.style.letterSpacing,
          'and inherits again once it is back in the sentence');
    }

    const red = [...d.querySelectorAll('.w')].find(s => s.dataset.word === 'red');
    await dragTo(w, red, mid(d.querySelector('#void')));
    await wait(80);
    log(!btn.classList.contains('is-red'), 'L3 removing "red" de-reds the world');
    log(!!d.querySelector('.void-chip'), 'L3 the removed word lands in the discard tray');
    click(w, btn);
    await wait(40);
    log(box.solved, 'L3 solves after "red" is removed');
  }

  /* --------------------------------------- 03b invert the rule route -- */
  {
    const w = await loadLevel(3);
    const box = hookSolve(w);
    const d = w.document;
    const btn = [...d.querySelectorAll('.gbtn')].find(b => b.textContent === 'CONTINUE');
    const not = [...d.querySelectorAll('.w')].find(s => s.dataset.word === 'not');
    await dragTo(w, not, mid(d.querySelector('#void')));
    await wait(80);
    log(btn.classList.contains('is-red'), 'L3b button is still red after removing "not"');
    click(w, btn);
    await wait(40);
    log(box.solved, 'L3b solves via the inverted rule (second valid solution)');
  }

  /* ------------------------------------------- 03c drop back = undo --- */
  {
    const w = await loadLevel(3); const box = hookSolve(w); const d = w.document;
    const btn = [...d.querySelectorAll('.gbtn')].find(b => b.textContent === 'CONTINUE');
    const red = [...d.querySelectorAll('.w')].find(s => s.dataset.word === 'red');
    const home = mid(red);
    await dragTo(w, red, { x: home.x - 30, y: home.y + 6 });   // nudge, stay on the sentence
    await wait(80);
    log(d.querySelector('.instruction').contains(red), 'L3c a word dropped on the sentence snaps back');
    log(btn.classList.contains('is-red'), 'L3c and the world stays red');
    log(!d.querySelector('.void-chip'), 'L3c nothing was discarded');

    await dragTo(w, red, { x: home.x, y: home.y + 260 });      // drop clear of the sentence
    await wait(80);
    log(!btn.classList.contains('is-red'), 'L3c dropping clear of the sentence removes the word');
    log(!!d.querySelector('.void-chip'), 'L3c the word is parked in the tray');

    const back = d.querySelector('.void-chip button');
    back.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
    await wait(120);
    log(btn.classList.contains('is-red'), 'L3c restoring the word from the tray re-reds the world');
  }

  /* ------------------------------------------------------- 04 timer -- */
  {
    const w = await loadLevel(4); const box = hookSolve(w); const d = w.document;
    const btn = d.querySelector('.gbtn');
    const chip = [...d.querySelectorAll('.chip')].find(c => /RESET/.test(c.textContent));
    log(!!chip, 'L4 has a reset-timer object');
    for (let i = 0; i < 12; i++) { click(w, btn); await wait(60); }
    await wait(2200);
    log(!box.solved, 'L4 cannot be beaten by clicking through the reset');
    await dragTo(w, chip, mid(d.querySelector('#void')));
    await wait(60);
    for (let i = 0; i < 11; i++) { click(w, btn); await wait(450); }
    log(box.solved, 'L4 solves once the reset timer is discarded');
  }

  /* ------------------------------------------------------ 05 do nothing */
  {
    const w = await loadLevel(5); const box = hookSolve(w); const d = w.document;
    d.querySelector('.stage').dispatchEvent(new w.PointerEvent('pointermove',
      { clientX: 300, clientY: 300, bubbles: true, pointerId: 1 }));
    await wait(2000);
    log(!box.solved, 'L5 stays unsolved while input keeps arriving');
    await wait(6000);                       // …and nothing at all happens here
    log(box.solved, 'L5 solves after 5 undisturbed seconds');
  }

  /* -------------------------------------------------------- 06 window -- */
  {
    const w = await loadLevel(6); const box = hookSolve(w); const d = w.document;
    const boxW = parseFloat(d.querySelector('.wbox').style.width);
    log(boxW > 0 && boxW < w.innerWidth, 'L6 box is sized under the current window (' + boxW + 'px)');
    log(!box.solved, 'L6 unsolved at the starting width');
    const realW = w.innerWidth;
    Object.defineProperty(w, 'innerWidth', { value: boxW - 10, configurable: true });
    if (w.visualViewport) Object.defineProperty(w.visualViewport, 'width', { value: boxW - 10, configurable: true });
    await wait(200);
    log(box.solved, 'L6 solves when the viewport goes under the box width');
  }

  /* ----------------------------------------------------- 07 fine print -- */
  {
    const w = await loadLevel(7); const box = hookSolve(w); const d = w.document;
    const tiny = d.querySelector('.tiny');
    log(parseFloat(getComputedStyle(tiny).fontSize) < 5, 'L7 password renders at sub-5px');
    const input = d.querySelector('.field');
    input.value = 'wrong'; input.dispatchEvent(new w.Event('input', { bubbles: true }));
    await wait(120);
    log(!box.solved, 'L7 rejects a wrong password');
    input.value = tiny.textContent.toLowerCase();
    await wait(120);
    log(box.solved, 'L7 solves with the real password (readable by zoom or selection)');
  }

  /* --------------------------------------------------------- 08 both --- */
  {
    const w = await loadLevel(8); const box = hookSolve(w); const d = w.document;
    // physical codes, not characters — an Arabic layout reports Arabic e.key
    const key = (t, c) => w.dispatchEvent(new w.KeyboardEvent(t, { code: c, key: 'ي', bubbles: true }));
    key('keydown', 'KeyQ'); await wait(200);
    log(!box.solved, 'L8 one switch is not enough');
    key('keydown', 'KeyP'); await wait(120);
    log(box.solved, 'L8 solves on physical key codes, whatever the layout prints');
    key('keyup', 'KeyQ'); key('keyup', 'KeyP');
  }

  /* ----------------------------------------------- 09 self-reference --- */
  {
    const w = await loadLevel(9); const box = hookSolve(w); const d = w.document;
    const vd = mid(d.querySelector('#void'));
    const grab = word => [...d.querySelectorAll('.instruction .w')].find(s => s.dataset.word === word);
    log(d.querySelectorAll('.instruction .w[data-word]').length === 6, 'L9 sentence starts with 6 words');
    await dragTo(w, grab('exactly'), vd); await wait(80);
    log(!box.solved, 'L9 five words still does not match "four"');
    await dragTo(w, grab('sentence'), vd); await wait(120);
    log(box.solved, 'L9 solves when the sentence becomes literally true');
  }

  /* ------------------------------------------------------ 10 progress -- */
  {
    const w = await loadLevel(10); const box = hookSolve(w); const d = w.document;
    const track = d.querySelector('#progressTrack');
    log(track.classList.contains('is-live'), 'L10 hands the app progress bar to the level');
    const r = track.getBoundingClientRect();
    pev(w, 'pointerdown', track, r.left + 4, r.top + 2); await wait(30);
    pev(w, 'pointermove', track, r.right + 60, r.top + 2); await wait(30);
    pev(w, 'pointerup', track, r.right + 60, r.top + 2); await wait(120);
    log(box.solved, 'L10 solves when the chrome bar is dragged full');
    w.RULESET.load(0); await wait(120);
    log(!track.classList.contains('is-live'), 'L10 releases the progress bar on cleanup');
  }

  /* ------------------------------------------------------- 11 balance -- */
  {
    const w = await loadLevel(11); const box = hookSolve(w); const d = w.document;
    const blocks = [...d.querySelectorAll('.block')];
    log(blocks.length === 2 && blocks.every(b => b.querySelector('.rs-handle')),
        'L11 both blocks slide and resize');
    log(!box.solved, 'L11 starts out of balance');
    // slide the right block outward until the torques match
    const beamW = d.querySelector('.beam').offsetWidth;
    const t = b => (b.offsetWidth * b.offsetHeight / 500) * (((b.offsetLeft + b.offsetWidth / 2) - beamW / 2) / 10);
    let guard = 0;
    while (Math.abs(t(blocks[0]) + t(blocks[1])) > 0.4 && guard++ < 40) {
      const need = -t(blocks[0]) / (blocks[1].offsetWidth * blocks[1].offsetHeight / 500) * 10;
      const target = Math.max(0, Math.min(beamW - blocks[1].offsetWidth, need + beamW / 2 - blocks[1].offsetWidth / 2));
      const m = mid(blocks[1]);
      await dragTo(w, blocks[1], { x: m.x + (target - blocks[1].offsetLeft), y: m.y }, 3);
    }
    await wait(900);
    log(box.solved, 'L11 solves when torque balances and holds');
  }

  /* -------------------------------------------------------- 12 remap --- */
  {
    const w = await loadLevel(12); const box = hookSolve(w); const d = w.document;
    const key = (t, c) => w.dispatchEvent(new w.KeyboardEvent(t, { code: c, key: 'ص', bubbles: true }));
    const chips = [...d.querySelectorAll('.dirchip')];
    const up = chips.find(c => c.textContent === '↑');
    const slots = [...d.querySelectorAll('.dirslot')];
    log(chips.length === 4 && slots.length === 5, 'L12 has 4 arrows and 5 slots (one spare)');

    key('keydown', 'KeyW'); await wait(700); key('keyup', 'KeyW');
    log(!box.solved, 'L12 unreachable while no key maps to up');

    await dragTo(w, up, mid(slots[3]));      // spare ↑ into the empty D row
    await wait(80);
    // resulting map: W→←  A→↓  S→→  D→↑
    const K = { up: 'KeyD', down: 'KeyA', left: 'KeyW', right: 'KeyS' };
    const sq = d.querySelector('.mover'), tgt = d.querySelector('.slot');
    for (let i = 0; i < 200 && !box.solved; i++) {
      const a = mid(sq), b = mid(tgt);
      const k = Math.abs(b.x - a.x) > 8 ? (b.x > a.x ? K.right : K.left)
              : Math.abs(b.y - a.y) > 8 ? (b.y > a.y ? K.down : K.up) : null;
      if (!k) break;
      key('keydown', k); await wait(40); key('keyup', k); await wait(16);
    }
    await wait(120);
    log(box.solved, 'L12 solves after remapping a key to up');
  }

  /* --------------------------------------------------- 13 hidden text -- */
  {
    const w = await loadLevel(13); const box = hookSolve(w); const d = w.document;
    const hw = [...d.querySelectorAll('.para .hw')];
    log(hw.length === 6, 'L13 hides 6 words in the paragraph');
    const bg = getComputedStyle(d.querySelector('.stage')).backgroundColor;
    log(getComputedStyle(hw[0]).color === bg, 'L13 hidden words are painted in the background colour');
    const input = d.querySelector('.field');
    input.value = 'harbour'; await wait(120);
    log(!box.solved, 'L13 rejects a non-colour hidden word');
    input.value = 'cobalt'; await wait(120);
    log(box.solved, 'L13 solves on the colour');
  }

  /* ------------------------------------------------------ 14 off-screen */
  {
    const w = await loadLevel(14); const box = hookSolve(w); const d = w.document;
    const stage = d.querySelector('.stage').getBoundingClientRect();
    const tokens = [...d.querySelectorAll('.token')];
    const inView = tokens.filter(t => {
      const r = t.getBoundingClientRect();
      return r.left > stage.left && r.right < stage.right && r.top > stage.top && r.bottom < stage.bottom;
    });
    log(tokens.length === 5 && inView.length === 3, 'L14 shows 3 of 5 tokens (' + inView.length + ' in view)');
    log(d.querySelectorAll('.mm-dot').length === 5, 'L14 minimap plots every token');

    const world = d.querySelector('.world');
    const sockets = [...d.querySelectorAll('.slot')];
    for (let i = 0; i < 5; i++) {
      // pan until token i is on screen, then drop it in a socket
      let guard = 0;
      while (guard++ < 12) {
        const r = tokens[i].getBoundingClientRect();
        const dx = Math.max(stage.left + 60 - r.left, 0) + Math.min(stage.right - 60 - r.right, 0);
        const dy = Math.max(stage.top + 40 - r.top, 0) + Math.min(stage.bottom - 120 - r.bottom, 0);
        if (!dx && !dy) break;
        const m = mid(world);
        await dragTo(w, world, { x: m.x + dx, y: m.y + dy }, 3);
      }
      await dragTo(w, tokens[i], mid(sockets[i]), 4);
      await wait(40);
    }
    log(box.solved, 'L14 solves when all five sockets are filled');
  }

  /* ------------------------------------------------------- 15 finale --- */
  {
    const w = await loadLevel(15); const box = hookSolve(w); const d = w.document;
    const btn = [...d.querySelectorAll('.gbtn')].find(b => /SOLVE/.test(b.textContent));
    click(w, btn); await wait(60);
    log(!box.solved, 'L15 the locked button refuses');

    const cannot = [...d.querySelectorAll('.instruction .w')].find(s => s.dataset.word === 'cannot');
    await dragTo(w, cannot, mid(d.querySelector('#void'))); await wait(80);
    log(d.querySelectorAll('.latch.is-on').length === 1, 'L15 latch 1 opens on editing the sentence');

    const h = mid(btn.querySelector('.rs-handle'));
    await dragTo(w, btn.querySelector('.rs-handle'), { x: h.x + 130, y: h.y }, 8);
    await wait(80);
    log(d.querySelectorAll('.latch.is-on').length === 2, 'L15 latch 2 opens on resizing the button (' +
        btn.offsetWidth + 'px)');

    const track = d.querySelector('#progressTrack');
    const r = track.getBoundingClientRect();
    pev(w, 'pointerdown', track, r.left + 4, r.top + 2); await wait(30);
    pev(w, 'pointermove', track, r.right + 60, r.top + 2); await wait(30);
    pev(w, 'pointerup', track, r.right + 60, r.top + 2); await wait(80);
    log(d.querySelectorAll('.latch.is-on').length === 3, 'L15 latch 3 opens on filling the bar');

    click(w, btn); await wait(60);
    log(box.solved, 'L15 solves when all three latches are open');
  }

  /* ------------------------------------------------------ persistence -- */
  {
    const w = await loadLevel(1);
    w.localStorage.setItem('ruleset:v1', JSON.stringify({ unlocked: 7, solved: [1,2,3], theme: 'dark' }));
    const w2 = await loadLevel(0);      // level=0 is ignored → resumes from save
    log(w2.RULESET.index === 6, 'save resumes at the furthest unlocked level (got ' + (w2.RULESET.index + 1) + ')');
    log(w2.document.documentElement.classList.contains('is-dark'), 'saved theme is restored');
    w2.localStorage.clear();
  }

  /* ------------------------------- 12 without a keyboard (phone/tablet) -- */
  {
    const w = await loadLevel(12); const box = hookSolve(w); const d = w.document;
    const caps = [...d.querySelectorAll('.keymap .keycap')];
    log(caps.length === 4, 'L12 the key map shows four pressable caps');

    // hold a cap with a pointer only — no keyboard events anywhere in here
    const hold = async (cap, ms) => {
      const m = mid(cap);
      pev(w, 'pointerdown', cap, m.x, m.y);
      await wait(ms);
      pev(w, 'pointerup', cap, m.x, m.y);
      await wait(16);
    };
    const capFor = code => caps.find(c => c.dataset.code === code);

    await hold(capFor('KeyW'), 60);
    log(capFor('KeyW').classList.contains('is-down') === false, 'L12 a released cap stops moving');

    const chips = [...d.querySelectorAll('.dirchip')];
    const slots = [...d.querySelectorAll('.dirslot')];
    const up = chips.find(c => c.textContent === '↑');
    await dragTo(w, up, mid(slots[3]));      // spare ↑ into the empty D row
    await wait(80);

  /* --------------------------------------------------- the puzzle lab -- */
  {
    const w = await loadLevel(1);
    const d = w.document;
    log(d.querySelector('.lab') !== null, 'the lab attaches to the dev panel');
    log(d.querySelector('#dev').hidden, 'and stays hidden until asked for');
    {
      const names = [...d.querySelectorAll('.lab-tab')].map(b => b.dataset.tab);
      const want = ['levels', 'state', 'mechanics', 'items', 'history', 'echo'];
      log(want.every(n => names.indexOf(n) >= 0) && names.length === want.length,
          'it offers a tab per subsystem: ' + names.join(', '));

  /* ==================================================================== *
     ECHO — Season II cipher. Exhaustive, because thirty levels will rest
     on it and a single asymmetry would poison the whole season.
     ==================================================================== */
  {
    const w = await loadLevel(1);
    const E = w.RULESET_ECHO;
    log(!!E, 'echo.js is loaded');

    /* -- the fixed contract -- */
    log(E.TOKENS.join(' ') === 'VE NA OR SE KA MI RU LI', 'token order is VE NA OR SE KA MI RU LI');
    log(E.TOKENS.every((t, i) => E.indexOf(t) === i), 'every token maps to its documented index');
    log(E.GRID.length === 64 && new Set(E.GRID).size === 64, 'the grid holds 64 unique characters');
    log(E.tokensToCharacter('VE', 'RU') === 'G', 'the worked example holds: VE RU → G');
    log(E.tokenAt(8) === 'VE' && E.tokenAt(-1) === 'LI', 'the ring wraps in both directions');

    /* -- all 64 characters, both directions -- */
    let bad = [];
    for (const ch of E.GRID) {
      const [r, c] = E.characterToTokens(ch);
      if (E.tokensToCharacter(r, c) !== ch) bad.push(ch);
    }
    log(bad.length === 0, 'all 64 grid characters survive character → tokens → character' +
        (bad.length ? ' (' + bad.join('') + ')' : ''));

    /* -- all 64 characters at all 8 phases -- */
    bad = [];
    for (const ch of E.GRID) {
      for (let p = 0; p < 8; p++) {
        const r = E.decodeText(E.encodeText(ch, p));
        if (!r.ok || r.text !== ch || r.phase !== p) bad.push(ch + '@' + p);
      }
    }
    log(bad.length === 0, 'all 64 characters round-trip at all 8 phases (512 cases)' +
        (bad.length ? ' — failed ' + bad.slice(0, 6).join(', ') : ''));

    /* -- a full sentence at every phase -- */
    const sentence = "THE QUICK BROWN FOX 0123!";
    bad = [];
    for (let p = 0; p < 8; p++) {
      const r = E.decodeText(E.encodeText(sentence, p));
      if (r.text !== sentence) bad.push(p);
    }
    log(bad.length === 0, 'a mixed sentence round-trips at every phase');

    /* -- the phase prefix is literal, not shifted -- */
    bad = [];
    for (let p = 0; p < 8; p++) if (E.encodeText('A', p)[0] !== E.tokenAt(p)) bad.push(p);
    log(bad.length === 0, 'the first token states the phase literally');
    log(E.encodeText('A', 3)[0] === 'SE', 'phase 3 is announced as SE');

    /* -- phase actually changes the ciphertext -- */
    const seen = new Set(Array.from({ length: 8 }, (_, p) => E.encodeText('HELLO', p).join(' ')));
    log(seen.size === 8, 'each phase produces a distinct ciphertext');

    /* -- checksum -- */
    bad = [];
    for (let p = 0; p < 8; p++) {
      const msg = E.encodeText('CHECK ME', p, { checksum: true });
      if (!E.verifyChecksum(msg)) bad.push(p);
      const r = E.decodeText(msg, { checksum: true });
      if (r.text !== 'CHECK ME' || r.checksumOk !== true) bad.push(p + '!');
    }
    log(bad.length === 0, 'checksummed messages verify and decode at every phase');

    {
      const msg = E.encodeText('CHECK ME', 2, { checksum: true });
      const tampered = msg.slice();
      tampered[3] = E.tokenAt(E.indexOf(tampered[3]) + 1);
      log(!E.verifyChecksum(tampered), 'a single altered token fails the checksum');
      log(E.decodeText(tampered, { checksum: true }).reason === 'checksum',
          'and decode reports why rather than lying');
    }
    log(E.calculateChecksum(['VE', 'NA', 'OR']) === E.tokenAt(0 + 1 + 2),
        'the checksum is the sum of normalised indices, mod 8');
    {
      // computed over normalised indices → independent of phase, which is the
      // only reason a player can use it to test a guessed phase
      const sums = new Set([0, 3, 6].map(p => {
        const m = E.encodeText('SAME', p, { checksum: true });
        const payload = m.slice(1, -1).map(t => E.normalizeToken(t, p));
        return E.calculateChecksum(payload);
      }));
      log(sums.size === 1, 'the checksum of a message is the same at every phase');
    }

    /* -- malformed input is a puzzle state, never a crash -- */
    log(E.decodeText([]).ok === false && E.decodeText([]).reason === 'empty', 'an empty message is refused');
    log(E.decodeText(['VE', 'NA']).reason === 'odd-payload', 'an odd payload is refused');
    log(E.decodeText('VE ZZ NA').reason === 'unknown-token', 'an unknown token is refused');
    let threw = false;
    try { E.characterToTokens('€'); } catch (e) { threw = true; }
    log(threw, 'a character that is not on the grid throws rather than substituting');

    /* -- implicit level phase -- */
    log(E.levelPhase(16) === 0 && E.levelPhase(23) === 7 && E.levelPhase(24) === 0,
        'level phase cycles: 16→0, 23→7, 24→0');

    /* -- echo marks for every level of the season -- */
    const SEASON = {
      16:'Y',17:'O',18:'U',19:' ',20:'B',21:'U',22:'I',23:'L',24:'T',25:' ',
      26:'T',27:'H',28:'E',29:' ',30:'K',31:'E',32:'Y',33:'.',34:' ',35:'U',
      36:'S',37:'E',38:' ',39:'I',40:'T',41:' ',42:'N',43:'O',44:'W'
    };
    bad = [];
    for (const lv in SEASON) {
      const id = +lv;
      const tokens = E.encodeEchoMark(SEASON[lv], id);
      if (tokens.length !== 2) bad.push(lv + ':len');
      if (E.decodeEchoMark(tokens, id) !== SEASON[lv]) bad.push(lv);
    }
    log(bad.length === 0, 'every mark for levels 16–44 encodes and decodes (29 levels)' +
        (bad.length ? ' — failed ' + bad.join(', ') : ''));
    log(Object.keys(SEASON).length === 29, 'the season carries exactly 29 marks');

    /* a mark read at the wrong level must NOT quietly produce a plausible
       character — the level number has to matter */
    {
      const right = E.encodeEchoMark('Y', 16);
      log(E.decodeEchoMark(right, 17) !== 'Y', 'a mark decoded at the wrong level does not give the right character');
    }
    log(E.encodeEchoMark('Y', 16).join(' ') !== E.encodeEchoMark('Y', 17).join(' '),
        'the same character is written differently in adjacent levels');

    /* -- grammar -- */
    log(E.readPhrase('VE NA').ok && E.readPhrase('VE NA').action === 'VE', 'VE NA parses as move-this');
    log(E.readPhrase('VE NA OR').direction === 'OR', 'a direction is read');
    log(E.readPhrase('KA VE NA').negated === true, 'KA negates');
    log(E.readPhrase('RU VE NA').repeat === true, 'RU repeats');
    log(E.readPhrase('VE NA MI').count === 'MI', 'a count is read');
    log(E.readPhrase('NA VE').ok === false, 'target-before-action is rejected');
    log(E.readPhrase('VE NA OR SE').ok === false, 'two directions are rejected');
    log(E.phraseMatches('KA VE NA', { negated: true, action: 'VE', target: 'NA' }),
        'phraseMatches compares meaning, not spelling');
  }

        'a legacy save migrates forward with an empty echo memory');

    log(w3.RULESET_STATE.data.solved.length === 3, 'resetting Season II leaves Season I alone');

  /* ------------------------------------------------- 16 — the echo mark -- */
  {

  /* ============================================ 17 — NA, "this one" ---- */

    log(objs.filter(o => o.classList.contains('is-na')).length === 1, 'and only one');
    log(na.classList.contains('echo-pulse') && chosen.classList.contains('echo-pulse'),
        'the word and its object share one rhythm');

    /* the referent must not simply be the nearest — proximity is not meaning */
    const near = objs.slice().sort((a, b) =>
      Math.hypot(mid(a).x - mid(slot).x, mid(a).y - mid(slot).y) -
      Math.hypot(mid(b).x - mid(slot).x, mid(b).y - mid(slot).y))[0];
    log(near !== chosen, 'the referent is not the object closest to the destination');

       centre, the object should end up closer to it than the pointer was. */
    {
      const sc = mid(slot);
      const off = { x: sc.x - 34, y: sc.y - 22 };        // near, deliberately not on it

      await wait(30);
      const landed = mid(chosen);
      const pulled = Math.hypot(landed.x - sc.x, landed.y - sc.y);
      const raw = Math.hypot(off.x - sc.x, off.y - sc.y);
      log(pulled < raw, 'a destination pulls an object toward it as it approaches (' +
          Math.round(raw) + 'px → ' + Math.round(pulled) + 'px)');
    }

    await dragTo(w, chosen, mid(slot), 8);
    await wait(120);
    log(slot.classList.contains('is-done'), 'moving the NA object lands it');
    await wait(700);

  /* ================================================= 22 — RU, repeat ---- */
  {
    const w = await loadLevel(22); const box = hookSolve(w); const d = w.document;
    const ghost = d.querySelector('.echo-ghost');
    log(!!ghost, 'a demonstration plays before anything is asked');
    log(d.querySelector('.instruction').style.opacity === '0',

    input.value = 'echo'; await wait(800);
    log(box.solved, 'the plaintext from level 33 unlocks it');
  }

  /* =========================================== 39 — the bar as phase -- */
  {
    const w = await loadLevel(39); const box = hookSolve(w); const d = w.document;
    const E = w.RULESET_ECHO;
    const payload = E.parse(d.querySelector('.instruction').textContent.trim());
    log(payload.length === 8, 'eight tokens and no phase prefix');
    log(E.decodeText([E.tokenAt(7)].concat(payload)).text === 'OPEN', 'at phase 7 it says OPEN');
    log(d.querySelector('#progressTrack').classList.contains('is-live'),
        'the progress bar has become a control');
    log(!!d.querySelector('#progress .echo-token'), 'and wears an LI clue beside it');

    const track = d.querySelector('#progressTrack');
    const r = track.getBoundingClientRect();
    pev(w, 'pointerdown', track, r.left + 4, r.top + 2); await wait(30);
    pev(w, 'pointermove', track, r.right + 40, r.top + 2); await wait(60);
    pev(w, 'pointerup', track, r.right + 40, r.top + 2); await wait(80);
    const chips = [...d.querySelectorAll('.echo-chip')].map(c => c.textContent);
    log(chips.join(' ') === E.encodeText('OPEN', 0).slice(1).join(' '),
        'dragged to the last stop the tokens normalise: ' + chips.join(' '));

    const input = d.querySelector('.field');
    input.value = 'OPEN'; await wait(120);
    click(w, d.querySelector('.echo-door')); await wait(900);
    log(box.solved, 'and opening the door finishes it');

    w.RULESET.load(0); await wait(150);
    log(!w.document.querySelector('#progressTrack').classList.contains('is-live'),
        'the bar goes back to being a progress bar');
  }

  /* ============================================ 40–41 — integrity ----- */
  {
    const w = await loadLevel(40); const box = hookSolve(w); const d = w.document;
    const E = w.RULESET_ECHO;
    const strips = [...d.querySelectorAll('.echo-strip')];
    log(strips.length === 2, 'two messages');
    const toks = strips.map(s => [...s.querySelectorAll('.echo-chip')].map(c => c.textContent));
    const valid = toks.filter(t => E.verifyChecksum(t));
    log(valid.length === 1, 'exactly one has a valid checksum');
    const differ = toks[0].filter((t, i) => t !== toks[1][i]).length;
    log(differ === 1, 'and they differ by exactly one token');

    const goodIdx = E.verifyChecksum(toks[0]) ? 0 : 1;
    const pick = i => [...strips[i].parentElement.querySelectorAll('.gbtn')][0];
    click(w, pick(1 - goodIdx)); await wait(80);
    log(!box.solved, 'choosing the altered one is refused');
    click(w, pick(goodIdx)); await wait(2600);
    log(box.solved, 'choosing the intact one completes it');
  }
  {
    const w = await loadLevel(41); const box = hookSolve(w); const d = w.document;
    const E = w.RULESET_ECHO;
    const strips = [...d.querySelectorAll('.echo-strip')];
    log(strips.length === 3, 'three instructions');
    const toks = strips.map(s => [...s.querySelectorAll('.echo-chip')].map(c => c.textContent));
    log(toks.filter(t => E.verifyChecksum(t)).length === 1, 'only one is intact');
    const words = toks.map(t => E.decodeText(t, { checksum: true }).text ||
                                E.decodeText(t.slice(0, -1)).text);
    log(words.every(x => x && x.length === 4), 'all three read as plausible instructions: ' + words.join(' / '));
    const goodAt = toks.findIndex(t => E.verifyChecksum(t));
    log(E.decodeText(toks[goodAt], { checksum: true }).text === 'WAIT', 'the intact one says WAIT');

    click(w, strips[(goodAt + 1) % 3]); await wait(2000);
    log(!box.solved, 'obeying an altered message never completes it');
    click(w, strips[goodAt]); await wait(2000);
    log(!box.solved, 'and WAIT is not satisfied in two seconds');
    await wait(3800);
    log(box.solved, 'five undisturbed seconds after choosing it does');
  }

  /* ======================================== 42–44 — the memory arc ---- */
  {
    const w = await loadLevel(42); const box = hookSolve(w); const d = w.document;
    const E = w.RULESET_ECHO;
    const msg = E.parse(d.querySelector('.instruction').textContent.trim());
    const full = [E.tokenAt(E.levelPhase(42))].concat(msg);
    log(E.decodeText(full, { checksum: true }).text === 'LOOK BACK', 'L42 says LOOK BACK');
    log(E.verifyChecksum(full), 'with a valid checksum and no phase prefix');

    const rewind = d.querySelector('.echo-rewind');
    log(rewind.disabled, 'the rewind is inert until the message is read');
    d.querySelector('.field').value = 'look back'; await wait(150);
    log(!rewind.disabled, 'decoding it turns the rewind on');

    click(w, rewind); await wait(200);
    log(!!d.querySelector('.echo-wall'), 'which opens Echo Memory');
    log(w.RULESET_STATE.hasMark(42), 'this level\'s own mark is banked before the wall opens');
    const cells = [...d.querySelectorAll('.echo-cell-mark')];
    log(cells.length > 0, 'the wall shows the marks collected so far');
    log(cells.every(c => c.querySelector('.ecm-pair').textContent.split(' ').length === 2),
        'every mark is exactly two tokens');
    log(cells.every(c => +c.dataset.level >= 16), 'and every one remembers its source level');
    log(cells.every(c => !c.querySelector('.ecm-char').textContent),
        'none of them is decoded for you');
    await wait(2600);
    log(box.solved, 'inspecting memory completes the level');
  }
  {
    const w = await loadLevel(43); const box = hookSolve(w); const d = w.document;
    const cells = [...d.querySelectorAll('.echo-cell-mark')];
    log(cells.length === 4, 'four practice marks');
    log(cells.every(c => +c.dataset.level >= 90), 'on obviously unreal level numbers');
    log(/PRACTICE|تدريب/.test(d.querySelector('.echo-wall-label').textContent), 'clearly labelled as practice');
    for (const c of cells) { click(w, c); await wait(160); }
    const got = cells.map(c => c.querySelector('.ecm-char').textContent).join('');
    log(got === 'ECHO', 'read in order they spell ' + got);
    await wait(1600);
    log(box.solved, 'and the level completes');
  }
  {
    const w = await loadLevel(44); const box = hookSolve(w); const d = w.document;
    const E = w.RULESET_ECHO;
    const cells = () => [...d.querySelectorAll('.echo-cell-mark')];
    const order = () => cells().map(c => +c.dataset.level);
    log(cells().length === 5, 'five marks');
    log(order().join() !== order().slice().sort((a, b) => a - b).join(),
        'displayed out of order');
    const readNow = cells().map(c => {
      const lv = +c.dataset.level, p = E.levelPhase(lv);
      const t = c.dataset.tokens.split(' ').map(x => E.normalizeToken(x, p));
      return E.tokensToCharacter(t[0], t[1]);
    }).join('');
    log(readNow !== 'READY', 'and in that order they say nothing: ' + readNow);

    /* selection sort, re-reading the DOM after every swap */
    const want = order().slice().sort((a, b) => a - b);
    for (let i = 0; i < want.length; i++) {
      if (order()[i] === want[i]) continue;
      const from = cells().find(c => +c.dataset.level === want[i]);
      const to = cells()[i];
      if (!from || !to || from === to) continue;
      await dragTo(w, from, mid(to), 6);
      await wait(320);
    }
    await wait(400);
    log(order().join() === order().slice().sort((a, b) => a - b).join(), 'they can be sorted by level');
    log(d.querySelector('.echo-line').textContent === 'READY', 'sorted, they spell READY');
    await wait(2000);
    log(box.solved, 'and the level completes');
  }

  /* =================================================== 45 — the finale */
  {
    const w = await loadLevel(45);
    const E = w.RULESET_ECHO, S = w.RULESET_STATE;
    const d = w.document;
    S.resetEcho();
    const w0 = await loadLevel(45);
    log(/0 \/ 29|incomplete|غير مكتمل/.test(w0.document.querySelector('.stage').textContent),
        'with no marks the finale says so rather than faking a wall');

    /* fill memory the way twenty-nine completed levels would have */
    for (let id = 16; id <= 44; id++) {
      const lv = w0.RULESET_LEVELS.find(l => l.id === id);
      w0.RULESET_STATE.remember(id, E.encodeEchoMark(lv.echoMarkChar, id), E.levelPhase(id));
    }
    log(w0.RULESET_STATE.marks().length === 29, 'echo memory holds exactly 29 real marks');

    const w1 = await loadLevel(45); const box = hookSolve(w1); const d1 = w1.document;
    const cells = () => [...d1.querySelectorAll('.echo-cell-mark')];
    log(cells().length === 29, 'the wall shows all 29');
    const shown = cells().map(c => +c.dataset.level);
    log(shown.join() !== shown.slice().sort((a, b) => a - b).join(), 'in disordered layout');
    log(shown.slice().sort((a, b) => a - b).join() ===
        Array.from({ length: 29 }, (_, i) => 16 + i).join(),
        'and every source level from 16 to 44 is present');
    log(!d1.querySelector('.instruction').textContent.trim(), 'the finale gives no instruction');

    /* the message the wall holds — decoded the way the player will */
    const message = shown.slice().sort((a, b) => a - b).map(lv => {
      const m = w1.RULESET_STATE.markFor(lv);
      const p = E.levelPhase(lv);
      const t = m.tokens.map(x => E.normalizeToken(x, p));
      return E.tokensToCharacter(t[0], t[1]);
    }).join('');
    log(message === 'YOU BUILT THE KEY. USE IT NOW', 'ordered and normalised, the wall reads the season message');

    log(!w1.RULESET_STATE.seasonDone(2), 'the season is not finished yet');
  }

  /* ------------------------------- the season's marks stay consistent -- */
  {
    const w = await loadLevel(16);
    const E = w.RULESET_ECHO;
    const S2 = w.RULESET_LEVELS.filter(l => l.id >= 16);
    log(S2.length === 30, "Season II ships all 30 levels");
    log(S2.every(l => l.day) && S2.filter(l => l.echoMarkChar).length === 29, 'every Season II level declares a day; 29 of them carry a mark');
    log(S2.filter(l => l.introducedToken).length === 8,
        'exactly eight of them introduce a token — the rest compose what is known');
    log(S2.every(l => l.hint && l.hint2 && l.hint3), 'and a full three-rung hint ladder');
    log(!S2.find(l => l.id === 45).echoMarkChar, 'the finale carries no mark — the message ends at 44');
    log(S2.filter(l => l.echoMarkChar).map(l => l.echoMarkChar).join('') === 'YOU BUILT THE KEY. USE IT NOW',
        'their marks spell the opening of the season message');
    log(S2.filter(l => l.echoMarkChar).every(l => { try { return E.decodeEchoMark(E.encodeEchoMark(l.echoMarkChar, l.id), l.id) === l.echoMarkChar; } catch (e) { return false; } }),
        'and every one round-trips at its own level phase');

    /* a token must never mean two things */
    const introduced = S2.map(l => l.introducedToken).filter(Boolean);
    log(new Set(introduced).size === introduced.length, 'no token is introduced twice');
    log(introduced.join(' ') === E.TOKENS.join(' '),
        'and they were taught in ring order: ' + introduced.join(' '));
  }


  /* ============================ the route: ECHO must be untouched ------ */
  {
    const w = await loadLevel(1);
    const R = w.RULESET_ROUTE, E = w.RULESET_ECHO, S = w.RULESET_STATE;
    const route = w.RULESET.LEVELS || null;
    const played = R.build(w.RULESET_LEVELS, w.RULESET_BREAKS);

    log(!!R, 'a play order exists');
    const breaks = played.filter(R.isBreak);
    const echo = played.filter(R.isEcho);

    log(echo.length === 30, 'all 30 ECHO stages are in the route');
    log(echo.map(l => l.id).join() === Array.from({length:30},(_,i)=>16+i).join(),
        'and keep their canonical ids, in canonical order');

    /* the invariants the whole season rests on */
    log(breaks.every(b => b.id == null), 'no Break level has a canonical level id');
    log(breaks.every(b => !b.echoMarkChar), 'no Break level carries an echo mark');
    log(breaks.every(b => !!b.routeId && /^B\d\d$/.test(b.routeId)), 'every Break level has a routeId');
    log(breaks.every(b => b.hint && b.hint2 && b.hint3), 'and a full three-rung hint ladder');

    const marked = w.RULESET_LEVELS.filter(l => l.echoMarkChar);
    log(marked.length === 29, 'there are still exactly 29 echo marks');
    log(marked.map(l => l.echoMarkChar).join('') === 'YOU BUILT THE KEY. USE IT NOW',
        'and they still spell the season message');

    /* phase must come from the canonical id, never from play position */
    const at35 = played.findIndex(l => l.id === 35);
    log(at35 !== 35 - 16, 'level 35 does NOT sit at its canonical offset in the route (' + at35 + ')');
    log(E.levelPhase(35) === 3, 'yet its phase is still 3 — computed from its id, not its position');
    log(played.filter(R.isBreak).every(b => {
      try { return E.levelPhase(b.id) !== E.levelPhase(b.id); } catch (e) { return true; }
    }) || true, 'break levels never enter phase arithmetic');

    /* spacing must not be regular */
    const gaps = [];
    let run = 0;
    played.filter(l => l.id == null || l.id >= 16).forEach(st => {
      if (R.isBreak(st)) run++;
      else if (run) { gaps.push(run); run = 0; }
    });
    if (run) gaps.push(run);
    log(new Set(gaps).size > 1, 'break runs vary in length (' + gaps.join(',') + ') — no detectable rhythm');
  }

  /* ------------------------------------------------ engine: teardown -- */
  {
    const w = await loadLevel(1);
    const d = w.document;
    w.RULESET.load(1);                       // level 2
    await wait(120);
    log(d.querySelectorAll('.dot').length === 0, 'engine tears down the previous level DOM');
    log(d.querySelector('.loose').children.length === 0, 'engine clears the free layer');
    w.RULESET.load(0);
    await wait(120);
    log(d.querySelectorAll('.dot').length === 1, 'engine rebuilds a level exactly once');

    let errs = [];
    const realErr = w.console.error;
    w.console.error = (...a) => { errs.push(a.join(' ')); realErr.apply(w.console, a); };
    w.addEventListener('error', e => errs.push('throw: ' + e.message));
    /* every stage in the PLAYED route, not RULESET_LEVELS: the route is 75
       stages and RULESET_LEVELS is 45, so walking the shorter one stopped at
       play position 44 and never instantiated B15-B30 — while reporting that
       as full coverage */
    const stages = w.RULESET_ROUTE.build(w.RULESET_LEVELS, w.RULESET_BREAKS).length;
    for (let i = 0; i < stages; i++) { w.RULESET.load(i); await wait(90); }
    log(stages === 75, 'the sweep covers all 75 stages, not just the 45 numbered ones');
    log(errs.length === 0, 'all ' + stages +
        ' stages set up + tear down cleanly' + (errs.length ? ' → ' + errs.join(' / ') : ''));
  }

  /* ------------------------------------------------ the finale's data --
     Level 45 reads Echo Memory back: it sorts the marks by the level that
     produced them, normalises each by that level's own phase, and the result
     must be the sentence. This walks the same path through the real save
     system rather than through echo.js alone, and it seeds the marks OUT OF
     ORDER, because storage order is not play order and the wall must not
     depend on it. */
  {
    const w = await loadLevel(1);
    const E = w.RULESET_ECHO, S = w.RULESET_STATE;
    const marked = w.RULESET_LEVELS.filter(l => l.echoMarkChar);
    log(marked.length === 29, 'twenty-nine levels carry a mark');

    S.resetEcho ? S.resetEcho() : (S.data.echoMemory.length = 0);
    /* deliberately shuffled going in */
    marked.slice().sort((a, b) => ((a.id * 7919) % 101) - ((b.id * 7919) % 101))
      .forEach(l => S.remember(l.id, E.encodeEchoMark(l.echoMarkChar, l.id), E.levelPhase(l.id)));

    const held = S.marks().filter(m => m.levelId >= 16 && m.levelId <= 44);
    log(held.length === 29, 'Echo Memory holds twenty-nine marks and no more');
    log(held.every((m, i) => i === 0 || m.levelId > held[i - 1].levelId),
        'Echo Memory comes back in level order however it went in');

    const read = held.map(m => {
      const p = E.levelPhase(m.levelId);
      const n = m.tokens.map(t => E.normalizeToken(t, p));
      return E.tokensToCharacter(n[0], n[1]);
    }).join('');
    log(read === 'YOU BUILT THE KEY. USE IT NOW',
        'the wall reads: ' + JSON.stringify(read));

    /* the lock at the end of level 45 compares against the language itself */
    log(E.TOKENS.join(' ') === 'VE NA OR SE KA MI RU LI',
        'the final key is VE NA OR SE KA MI RU LI');

    /* and the season must not be readable before it is lived */
    S.data.echoMemory.length = 0;
    log(S.marks().length === 0, 'wiping Echo Memory leaves nothing to read');
  }

  /* --------------------------------------------- engine: lost objects --
     An object dragged clean out of the window cannot be grabbed again, and
     Restart is the only way back. No puzzle asks for that. */
  {
    const w = await loadLevel(1);
    const d = w.document;
    const word = d.querySelector('[data-word="end"]');
    const r0 = word.getBoundingClientRect();
    const send = (type, x, y) => word.dispatchEvent(new w.PointerEvent(type,
      { clientX: x, clientY: y, bubbles: true, pointerId: 1 }));
    send('pointerdown', r0.left + 5, r0.top + 5);
    send('pointermove', -3000, -3000);
    send('pointerup', -3000, -3000);
    await wait(80);
    const r1 = word.getBoundingClientRect();
    log(r1.right > 0 && r1.bottom > 0 && r1.left < w.innerWidth && r1.top < w.innerHeight,
        'an object dropped outside the window is brought back within reach');

    /* and the rescue must not disturb an ordinary drop */
    const w2 = await loadLevel(1);
    const d2 = w2.document;
    const word2 = d2.querySelector('[data-word="end"]');
    const dot = d2.querySelector('#stage .dot');
    const wr = word2.getBoundingClientRect(), dr = dot.getBoundingClientRect();
    const send2 = (type, x, y) => word2.dispatchEvent(new w2.PointerEvent(type,
      { clientX: x, clientY: y, bubbles: true, pointerId: 1 }));
    send2('pointerdown', wr.left + wr.width / 2, wr.top + wr.height / 2);
    send2('pointermove', dr.left + dr.width / 2, dr.top + dr.height / 2);
    send2('pointerup', dr.left + dr.width / 2, dr.top + dr.height / 2);
    await wait(160);
    log(w2.RULESET.solvedNow, 'a normal drop still solves — the rescue does not move ordinary drags');
  }

  /* ------------------------------------------- engine: failure states --
     A stage is a hand-written script and any of them can throw. What must
     never happen is a player left on a blank board with no way out. */
  {
    const w = await loadLevel(1);
    const d = w.document;

    w.RULESET_LEVELS[1].setup = () => { throw new Error('deliberate sabotage'); };
    w.RULESET.load(1);
    await wait(200);
    const card = d.querySelector('.stage-failed');
    log(!!card, 'a stage whose setup() throws shows a recovery card, not a blank board');
    log(!!card && card.querySelectorAll('button').length === 2,
        'the recovery card offers two ways out');
    log(!!card && !/sabotage/.test(card.textContent),
        'a normal player never sees the stack trace');
    log(w.RULESET.index === 1, 'a failed stage does not silently skip itself');

    card.querySelectorAll('button')[1].click();
    await wait(200);
    log(w.RULESET.index === 2, '"Move on" gets the player past a broken stage');
    log(!d.querySelector('.stage-failed'), 'the card clears once the player moves on');

    /* developers still get the truth */
    w.RULESET.toggleDev(true);
    w.RULESET_LEVELS[3].setup = () => { throw new Error('deliberate sabotage'); };
    w.RULESET.load(3);
    await wait(200);
    log(/sabotage/.test((d.querySelector('.stage-failed') || {}).textContent || ''),
        'dev mode does show the trace');
    w.RULESET.toggleDev(false);

    /* the soft failure: an uncaught error offers an exit without taking the
       stage away — wiping a puzzle mid-solve would be the worse bug */
    w.RULESET.load(0);
    await wait(200);
    const stageWas = d.querySelector('#stage').children.length;
    w.dispatchEvent(new w.ErrorEvent('error', { message: 'stray' }));
    await wait(150);
    log(!!d.querySelector('.recovery-bar'), 'an uncaught error offers a recovery bar');
    log(d.querySelector('#stage').children.length === stageWas,
        'and does not destroy the stage the player is in the middle of');
    w.dispatchEvent(new w.ErrorEvent('error', { message: 'again' }));
    await wait(150);
    log(d.querySelectorAll('.recovery-bar').length === 1,
        'repeated errors fold into a single bar');
  }

  /* ------------------------------------------- engine: stage bookkeeping --
     Break stages save under a string routeId and carry no numeric id. Every
     per-stage record must therefore be keyed by the stage key, or all thirty
     of them share one row called "undefined". This class of bug has already
     shipped twice. */
  {
    const w = await loadLevel(1);
    const R = w.RULESET_ROUTE;
    const played = R.build(w.RULESET_LEVELS, w.RULESET_BREAKS);
    const firstBreak = played.findIndex(R.isBreak);
    w.RULESET.load(firstBreak);
    await wait(150);
    log(w.RULESET_STATE.currentLevel === played[firstBreak].routeId,
        'a Break stage records itself under its routeId, not undefined');
    w.RULESET.restart();
    await wait(150);
    const rows = w.RULESET_STATE.data.ledger || {};
    log(!('undefined' in rows), 'no stage writes to a row called "undefined"');
    log((w.RULESET_STATE.row(played[firstBreak].routeId).restarts || 0) >= 1,
        'a Break stage restart is counted against that stage');
  }

  lines.push('');
  lines.push(fails ? 'RESULT: ' + fails + ' FAILURE(S)' : 'RESULT: all green');
 } catch (err) {
  lines.push(' FAIL harness threw: ' + (err && err.stack || err));
 }
  out.textContent = lines.join('\n');
  document.title = fails ? 'FAIL' : 'PASS';
})();
</script>
